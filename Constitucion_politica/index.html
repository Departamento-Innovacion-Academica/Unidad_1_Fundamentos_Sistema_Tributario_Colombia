<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículos Constitución Política</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-wrapper {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      background: transparent;
      border-radius: 32px;
      padding: 24px 20px 32px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #03223D;
      margin-bottom: 8px;
      line-height: 1.2;
      font-family: 'Poppins', sans-serif;
    }

    .header p {
      font-size: 0.95rem;
      color: #0D1F2D;
      opacity: 0.75;
      font-family: 'Poppins', sans-serif;
    }

    /* Contenedor principal */
    .carousel-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Cards container */
    .cards-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 520px;
      margin: 0 auto;
      perspective: 1200px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      padding: 28px 24px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
      left: 0;
      top: 0;
      will-change: transform, opacity;
      backface-visibility: hidden;
      background: #ffffff;
      border: 1px solid #e8ecf0;
      box-shadow: 0 20px 35px rgba(3, 34, 61, 0.08);
    }

    .card-number {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(53, 98, 137, 0.10);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      color: #356289;
      font-family: 'Poppins', sans-serif;
    }

    .icon-circle {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #03223D 0%, #356289 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      margin-bottom: 20px;
      margin-top: 8px;
      box-shadow: 0 6px 12px rgba(3, 34, 61, 0.15);
      transition: transform 0.2s ease;
    }
    
    .card:hover .icon-circle {
      transform: scale(1.05);
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #03223D;
      line-height: 1.2;
      font-family: 'Poppins', sans-serif;
    }

    .card-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .definition {
      font-size: 0.92rem;
      line-height: 1.6;
      font-weight: 400;
      color: #1a264a;
      font-family: 'Poppins', sans-serif;
    }

    .definition strong {
      color: #03223D;
      font-weight: 600;
    }

    .articulo-ref {
      display: inline-block;
      background: #03223D;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 8px;
      letter-spacing: 0.3px;
      font-family: 'Poppins', sans-serif;
      align-self: flex-start;
    }

    .fuente {
      font-size: 0.7rem;
      color: #6b7a9f;
      font-style: italic;
      font-weight: 400;
      margin-top: 4px;
      font-family: 'Poppins', sans-serif;
    }

    /* Efectos de transición */
    .card.exit-left {
      transform: translateX(-180%) rotate(-20deg) !important;
      opacity: 0;
    }

    .card.exit-right {
      transform: translateX(180%) rotate(20deg) !important;
      opacity: 0;
    }

    /* Controles de navegación */
    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-top: 16px;
      padding: 12px 24px;
      background: #FFFFFF;
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(3, 34, 61, 0.06);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid #e8ecf0;
    }

    .arrow-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid #e8ecf0;
      background: #ffffff;
      color: #03223D;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .arrow-btn:hover:not(:disabled) {
      background: #356289;
      color: white;
      transform: translateY(-2px);
      border-color: #356289;
    }

    .arrow-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Indicadores de posición */
    .indicators-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .carousel-indicators {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d0d5e0;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .indicator.active {
      width: 28px;
      border-radius: 12px;
      background: #356289;
    }

    .indicator:hover {
      background: #03223D;
      transform: scale(1.2);
    }

    .position-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #03223D;
      min-width: 55px;
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }

    /* Ajustes responsivos */
    @media (max-width: 400px) {
      .cards-container {
        height: 560px;
        max-width: 300px;
      }
      
      .card-title {
        font-size: 1.2rem;
      }
      
      .definition {
        font-size: 0.82rem;
      }
      
      .arrow-btn {
        width: 42px;
        height: 42px;
        font-size: 1.3rem;
      }
      
      .carousel-controls {
        gap: 20px;
        padding: 10px 18px;
      }
      
      .icon-circle {
        width: 48px;
        height: 48px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div id="game">
      <div class="header">
        <h1>Constitución Política de Colombia</h1>
        <p>Haga clic sobre las flechas (>) para navegar.</p>
      </div>
      
      <div class="carousel-container">
        <div class="cards-container" id="cardPile"></div>

        <div class="carousel-controls">
          <button class="arrow-btn prev" id="prevBtn" disabled>←</button>
          
          <div class="indicators-wrapper">
            <div class="carousel-indicators" id="indicators"></div>
            <span class="position-text" id="position">1/5</span>
          </div>
          
          <button class="arrow-btn next" id="nextBtn">→</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const cards = [
        { 
          title: "Artículo 1",
          definition: `<strong>Colombia es un Estado social de derecho</strong>, organizado en forma de República unitaria, descentralizada, con autonomía de sus entidades territoriales, democrática, participativa y pluralista, fundada en el respeto de la dignidad humana, en el trabajo y la solidaridad de las personas que la integran y en la prevalencia del interés general.`,
          icon: "gavel",
          ref: "Artículo 1",
          fuente: "Constitución Política de Colombia, 1991"
        },
        { 
          title: "Artículo 15",
          definition: `Para efectos tributarios o judiciales, para los casos de inspección, vigilancia e intervención del Estado, podrá exigirse la presentación de <strong>libros de contabilidad</strong> y demás documentos privados.`,
          icon: "book",
          ref: "Artículo 15",
          fuente: "Constitución Política de Colombia, 1991"
        },
        { 
          title: "Artículo 95 - Numeral 9",
          definition: `Contribuir al <strong>financiamiento de los gastos e inversiones del Estado</strong> dentro de conceptos de justicia y equidad.`,
          icon: "coins",
          ref: "Artículo 95 # 9",
          fuente: "Constitución Política de Colombia, 1991"
        },
        { 
          title: "Artículo 338",
          definition: `En tiempos de paz, <strong>solo el Congreso, asambleas y consejos</strong> podrán imponer contribuciones.`,
          icon: "landmark",
          ref: "Artículo 338",
          fuente: "Constitución Política de Colombia, 1991"
        },
        { 
          title: "Artículo 363",
          definition: `El <strong>sistema tributario</strong> se funda en los principios de equidad, eficiencia y progresividad. Las leyes tributarias no se aplicarán con retroactividad.`,
          icon: "balance-scale",
          ref: "Artículo 363",
          fuente: "Constitución Política de Colombia, 1991"
        }
      ];

      let currentCardIndex = 0;

      function createCards() {
        const pile = document.getElementById('cardPile');
        if (!pile) return;
        
        pile.innerHTML = '';

        cards.forEach((card, index) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.dataset.index = index;

          const reverseIndex = cards.length - 1 - index;
          const offsetY = reverseIndex * 5;
          const offsetX = reverseIndex * 3;
          const rotation = (index % 2 === 0 ? 1 : -1) * (1.5 + Math.random());

          if (index === currentCardIndex) {
            cardEl.style.transform = `translateX(0) translateY(0) rotate(0deg)`;
            cardEl.style.zIndex = 10;
            cardEl.style.opacity = 1;
          } else if (index < currentCardIndex) {
            cardEl.style.transform = `translateX(-120%) translateY(10px) rotate(-8deg)`;
            cardEl.style.zIndex = 0;
            cardEl.style.opacity = 0;
          } else {
            cardEl.style.transform = `translateX(${offsetX + 20}px) translateY(${offsetY}px) rotate(${rotation}deg)`;
            cardEl.style.zIndex = index;
            cardEl.style.opacity = 1;
          }

          cardEl.innerHTML = `
            <span class="card-number">${index + 1}/${cards.length}</span>
            <div class="icon-circle">
              <i class="fas fa-${card.icon}"></i>
            </div>
            <h3 class="card-title">${card.title}</h3>
            <div class="card-content">
              <p class="definition">${card.definition}</p>
              <span class="articulo-ref">${card.ref}</span>
              <span class="fuente">Fuente: ${card.fuente}</span>
            </div>
          `;

          pile.appendChild(cardEl);
        });

        updateIndicators();
        updateButtons();
      }

      function updateCards() {
        const cardElements = document.querySelectorAll('.card');
        
        cardElements.forEach((card, index) => {
          const reverseIndex = cards.length - 1 - index;
          const offsetY = reverseIndex * 5;
          const offsetX = reverseIndex * 3;
          const rotation = (index % 2 === 0 ? 1 : -1) * (1.5 + Math.random());

          if (index === currentCardIndex) {
            card.style.transform = 'translateX(0) translateY(0) rotate(0deg)';
            card.style.zIndex = 10;
            card.style.opacity = 1;
          } else if (index < currentCardIndex) {
            card.style.transform = 'translateX(-120%) translateY(10px) rotate(-8deg)';
            card.style.zIndex = 0;
            card.style.opacity = 0;
          } else {
            card.style.transform = `translateX(${offsetX + 20}px) translateY(${offsetY}px) rotate(${rotation}deg)`;
            card.style.zIndex = index;
            card.style.opacity = 1;
          }
        });

        updateIndicators();
        updateButtons();
      }

      function updateIndicators() {
        const indicatorsContainer = document.getElementById('indicators');
        const positionText = document.getElementById('position');
        
        if (indicatorsContainer) {
          indicatorsContainer.innerHTML = '';
          
          for (let i = 0; i < cards.length; i++) {
            const indicator = document.createElement('span');
            indicator.className = `indicator ${i === currentCardIndex ? 'active' : ''}`;
            indicator.onclick = () => goToCard(i);
            indicatorsContainer.appendChild(indicator);
          }
        }
        
        if (positionText) {
          positionText.textContent = `${currentCardIndex + 1}/${cards.length}`;
        }
      }

      function updateButtons() {
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        if (prevBtn) {
          prevBtn.disabled = currentCardIndex === 0;
        }
        
        if (nextBtn) {
          nextBtn.disabled = currentCardIndex === cards.length - 1;
        }
      }

      function navigateCard(direction) {
        if (direction === 'prev' && currentCardIndex > 0) {
          currentCardIndex--;
          updateCards();
        } else if (direction === 'next' && currentCardIndex < cards.length - 1) {
          currentCardIndex++;
          updateCards();
        }
      }

      function goToCard(index) {
        if (index >= 0 && index < cards.length) {
          currentCardIndex = index;
          updateCards();
        }
      }

      document.getElementById('prevBtn').addEventListener('click', () => navigateCard('prev'));
      document.getElementById('nextBtn').addEventListener('click', () => navigateCard('next'));

      createCards();
    })();
  </script>
</body>
</html>
