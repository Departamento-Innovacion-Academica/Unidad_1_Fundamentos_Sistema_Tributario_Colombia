<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo 363 - Principios Tributarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f6f8fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 36px 32px;
      box-shadow: 0 8px 40px rgba(3, 34, 61, 0.08);
      border: 1px solid #eef0f6;
    }

    /* Grid de tarjetas */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }

    /* Las primeras tres tarjetas */
    .card {
      grid-column: span 2;
    }

    /* Centrar las tarjetas 4 y 5 */
    .card:nth-child(4) {
      grid-column: 2 / span 2;
    }

    .card:nth-child(5) {
      grid-column: 4 / span 2;
    }

    /* Tarjeta individual */
    .card {
      background: #fafbff;
      border-radius: 16px;
      padding: 24px 16px 20px;
      border: 1px solid #eef0f6;
      text-align: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(60px);
      box-shadow: 0 2px 8px rgba(3, 34, 61, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(3, 34, 61, 0.08);
      border-color: #356289;
    }

    .card .icono {
      font-size: 2rem;
      color: #356289;
      margin-bottom: 6px;
      display: block;
    }

    .card .titulo {
      font-size: 1rem;
      font-weight: 700;
      color: #03223D;
      line-height: 1.3;
    }

    .card .numero {
      font-size: 0.6rem;
      font-weight: 700;
      color: #356289;
      background: rgba(53, 98, 137, 0.08);
      padding: 2px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 6px;
    }

    /* Tarjeta especial (full width) - CENTRADA */
    .card-full {
      grid-column: 1 / -1;
      background: #03223D;
      color: #ffffff;
      border-color: #356289;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(60px);
      text-align: center;
      min-height: 80px;
    }

    .card-full.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card-full:hover {
      background: #0a2a4a;
      border-color: #5f7ef0;
    }

    .card-full .icono {
      color: #ffffff;
      font-size: 1.6rem;
      opacity: 0.9;
    }

    .card-full .titulo {
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* Animación de entrada */
    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(60px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card.visible {
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .card-full.visible {
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 24px 16px 20px;
        border-radius: 18px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .card,
      .card:nth-child(4),
      .card:nth-child(5) {
        grid-column: auto;
      }

      .card-full {
        grid-column: 1 / -1;
      }

      .card {
        padding: 18px 12px 16px;
        min-height: 100px;
      }

      .card .titulo {
        font-size: 0.85rem;
      }

      .card .icono {
        font-size: 1.6rem;
      }

      .card-full {
        padding: 16px 18px;
        min-height: 70px;
        gap: 12px;
      }

      .card-full .titulo {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 400px) {
      .container {
        padding: 16px 10px 16px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .card,
      .card:nth-child(4),
      .card:nth-child(5) {
        grid-column: auto;
      }

      .card-full {
        grid-column: 1 / -1;
      }

      .card {
        padding: 12px 10px 12px;
        min-height: 80px;
      }

      .card .titulo {
        font-size: 0.75rem;
      }

      .card .icono {
        font-size: 1.3rem;
      }

      .card-full {
        padding: 12px 14px;
        min-height: 60px;
        gap: 8px;
      }

      .card-full .titulo {
        font-size: 0.8rem;
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f0f2f7;
    }
    ::-webkit-scrollbar-thumb {
      background: #c8d0df;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #356289;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Grid de tarjetas -->
    <div class="grid" id="gridCards">

      <!-- Tarjeta 1: Equidad -->
      <div class="card" data-delay="0">
        <span class="icono">⚖️</span>
        <div class="titulo">Equidad</div>
        <span class="numero">01</span>
      </div>

      <!-- Tarjeta 2: Eficiencia -->
      <div class="card" data-delay="1">
        <span class="icono">📊</span>
        <div class="titulo">Eficiencia</div>
        <span class="numero">02</span>
      </div>

      <!-- Tarjeta 3: Progresividad -->
      <div class="card" data-delay="2">
        <span class="icono">📈</span>
        <div class="titulo">Progresividad</div>
        <span class="numero">03</span>
      </div>

      <!-- Tarjeta 4: No Retroactividad -->
      <div class="card" data-delay="3">
        <span class="icono">⏳</span>
        <div class="titulo">No Retroactividad</div>
        <span class="numero">04</span>
      </div>

      <!-- Tarjeta 5: Legalidad -->
      <div class="card" data-delay="4">
        <span class="icono">📜</span>
        <div class="titulo">Legalidad</div>
        <span class="numero">05</span>
      </div>

      <!-- Tarjeta 6: Artículo 363 (full width) -->
      <div class="card-full" data-delay="5">
        <span class="icono">🏛️</span>
        <span class="titulo">Artículo 363</span>
      </div>

    </div>

  </div>

  <script>
    // ============================================ //
    // ANIMACIÓN SECUENCIAL DE ABAJO HACIA ARRIBA
    // ============================================ //

    const cards = document.querySelectorAll('.card, .card-full');

    function iniciarAnimacion() {
      cards.forEach((card, index) => {
        const delay = parseInt(card.dataset.delay) || index;
        const tiempo = 200 + (delay * 180);
        setTimeout(() => {
          card.classList.add('visible');
        }, tiempo);
      });
    }

    window.addEventListener('load', function() {
      setTimeout(iniciarAnimacion, 300);
    });

    if (document.readyState === 'complete') {
      setTimeout(iniciarAnimacion, 300);
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(iniciarAnimacion, 300);
      });
    }

    console.log('Artículo 363 - Principios Tributarios');
    console.log('Paleta: #03223D / #356289');
    console.log('6 tarjetas con animación de abajo hacia arriba');
  </script>

</body>
</html>
