<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estatuto tributario</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      background: #ffffff;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    .diagrama {
      position: relative;
      width: 100%;
      max-width: 850px;
      min-height: 520px;

      display: grid;
      grid-template-columns: 180px 120px 1fr;
      align-items: center;
    }

    /* ==============================
       BLOQUE ESTATUTO TRIBUTARIO
    ============================== */

    .estatuto {
      position: relative;
      z-index: 3;

      width: 180px;
      height: 480px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #03223D;
      border-radius: 18px 0 0 18px;

      opacity: 0;
      transform: translateX(-80px) scale(0.96);
    }

    .estatuto.visible {
      animation: entradaEstatuto 0.9s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .estatuto span {
      color: #ffffff;
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      font-weight: 400;
      letter-spacing: 1px;
      white-space: nowrap;

      transform: rotate(-90deg);
    }

    /* ==============================
       CONECTOR
    ============================== */

    .conector {
      position: relative;
      width: 120px;
      height: 480px;
    }

    .linea-central,
    .linea-vertical,
    .linea-superior,
    .linea-medio,
    .linea-inferior {
      position: absolute;
      display: block;
      background: #356289;
      border-radius: 10px;
    }

    .linea-central {
      top: 50%;
      left: 0;
      width: 50px;
      height: 4px;

      transform: translateY(-50%) scaleX(0);
      transform-origin: left center;
    }

    .linea-vertical {
      top: 25%;
      left: 48px;
      width: 4px;
      height: 50%;

      transform: scaleY(0);
      transform-origin: center center;
    }

    .linea-superior {
      top: 25%;
      left: 48px;
      width: 75px;
      height: 4px;

      transform: scaleX(0);
      transform-origin: left center;
    }

    .linea-medio {
      top: 50%;
      left: 48px;
      width: 75px;
      height: 4px;

      transform: translateY(-50%) scaleX(0);
      transform-origin: left center;
    }

    .linea-inferior {
      bottom: 25%;
      left: 48px;
      width: 75px;
      height: 4px;

      transform: scaleX(0);
      transform-origin: left center;
    }

    .conector.visible .linea-central {
      animation: dibujarHorizontal 0.35s ease forwards;
    }

    .conector.visible .linea-vertical {
      animation: dibujarVertical 0.55s ease 0.25s forwards;
    }

    .conector.visible .linea-superior,
    .conector.visible .linea-medio,
    .conector.visible .linea-inferior {
      animation: dibujarHorizontal 0.4s ease 0.7s forwards;
    }

    /* ==============================
       TARJETAS
    ============================== */

    .niveles {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }

    .nivel {
      width: 100%;
      min-height: 120px;
      padding: 20px 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #356289;
      color: #ffffff;
      text-align: center;

      opacity: 0;
      transform: translateX(120px) scale(0.92);
      box-shadow: 0 16px 32px rgba(3, 34, 61, 0);
    }

    .nivel.visible {
      animation: entradaTarjeta 0.8s
        cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .nivel h2 {
      font-size: clamp(1.4rem, 3.5vw, 2.8rem);
      font-weight: 400;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nivel:nth-child(2) h2 {
      font-size: clamp(1.1rem, 2.5vw, 2rem);
    }

    /* Efecto al pasar el cursor */

    .nivel,
    .estatuto {
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
    }

    .nivel:hover {
      background: #2a4f72;
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(3, 34, 61, 0.14);
    }

    /* ==============================
       ANIMACIONES
    ============================== */

    @keyframes entradaEstatuto {
      0% {
        opacity: 0;
        transform: translateX(-80px) scale(0.96);
      }

      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes entradaTarjeta {
      0% {
        opacity: 0;
        transform: translateX(120px) scale(0.92);
        filter: blur(6px);
      }

      65% {
        opacity: 1;
        transform: translateX(-8px) scale(1.01);
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
        box-shadow: 0 10px 24px rgba(3, 34, 61, 0.1);
      }
    }

    @keyframes dibujarHorizontal {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    @keyframes dibujarVertical {
      from {
        transform: scaleY(0);
      }

      to {
        transform: scaleY(1);
      }
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 850px) {
      .diagrama {
        max-width: 500px;
        min-height: auto;

        grid-template-columns: 1fr;
        gap: 18px;
      }

      .estatuto {
        width: 100%;
        height: auto;
        min-height: 90px;

        border-radius: 18px;

        transform: translateY(-50px) scale(0.96);
      }

      .estatuto span {
        transform: none;
        white-space: normal;
        text-align: center;
        font-size: clamp(1.5rem, 6vw, 2.4rem);
      }

      .conector {
        width: 100%;
        height: 60px;
      }

      .linea-central {
        top: 0;
        left: 50%;

        width: 4px;
        height: 60px;

        transform: translateX(-50%) scaleY(0);
        transform-origin: top center;
      }

      .linea-vertical,
      .linea-superior,
      .linea-medio,
      .linea-inferior {
        display: none;
      }

      .conector.visible .linea-central {
        animation: dibujarVertical 0.5s ease forwards;
      }

      .niveles {
        gap: 14px;
      }

      .nivel {
        min-height: 90px;
        border-radius: 12px;
        transform: translateY(50px) scale(0.94);
      }

      @keyframes entradaTarjeta {
        0% {
          opacity: 0;
          transform: translateY(50px) scale(0.94);
          filter: blur(5px);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
          box-shadow: 0 10px 24px rgba(3, 34, 61, 0.1);
        }
      }

      @keyframes entradaEstatuto {
        0% {
          opacity: 0;
          transform: translateY(-50px) scale(0.96);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 10px;
      }

      .estatuto {
        min-height: 75px;
        border-radius: 14px;
      }

      .nivel {
        min-height: 75px;
        padding: 14px 12px;
        border-radius: 10px;
      }

      .nivel h2 {
        font-size: 1.3rem;
      }

      .nivel:nth-child(2) h2 {
        font-size: 1rem;
      }
    }

    /* Accesibilidad */

    @media (prefers-reduced-motion: reduce) {
      .estatuto,
      .nivel,
      .linea-central,
      .linea-vertical,
      .linea-superior,
      .linea-medio,
      .linea-inferior {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <main class="diagrama" aria-label="Tipos de estatuto tributario">

    <section class="estatuto" id="estatuto">
      <span>ESTATUTO TRIBUTARIO</span>
    </section>

    <div class="conector" id="conector" aria-hidden="true">
      <span class="linea-central"></span>
      <span class="linea-vertical"></span>
      <span class="linea-superior"></span>
      <span class="linea-medio"></span>
      <span class="linea-inferior"></span>
    </div>

    <section class="niveles">

      <article class="nivel">
        <h2>Nacional</h2>
      </article>

      <article class="nivel">
        <h2>Departamental o<br>distrital</h2>
      </article>

      <article class="nivel">
        <h2>Municipal</h2>
      </article>

    </section>

  </main>

  <script>
    const estatuto = document.getElementById("estatuto");
    const conector = document.getElementById("conector");
    const niveles = document.querySelectorAll(".nivel");

    let animacionEjecutada = false;

    function ejecutarAnimacion() {
      if (animacionEjecutada) return;

      animacionEjecutada = true;

      setTimeout(() => {
        estatuto.classList.add("visible");
      }, 300);

      setTimeout(() => {
        conector.classList.add("visible");
      }, 1000);

      setTimeout(() => {
        niveles[0].classList.add("visible");
      }, 1800);

      setTimeout(() => {
        niveles[1].classList.add("visible");
      }, 2500);

      setTimeout(() => {
        niveles[2].classList.add("visible");
      }, 3200);
    }

    window.addEventListener("load", ejecutarAnimacion);
  </script>

</body>
</html>
